name: validate-index

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-index:
    name: validate-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test paper validation
        run: python -m unittest discover -s tests -v
      - name: Validate INDEX.md and primary paper identities
        run: python scripts/validate_papers.py
